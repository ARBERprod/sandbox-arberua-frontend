Огромный лог — но картина как раз проясняется. Давай сведу весь базлайн в таблицу, потому что почти вся краснота сводится к ОДНОЙ причине.

Табло базлайна

┌─────────────────┬───────────────────┬──────────────────────────┐
│    Проверка     │       Итог        │                        Причина                        │
├─────────────────┼───────────────────┼───────────────────────────────────────────────────────┤
│ npm ci          │ ✅                │ зависимости ставятся                                  │
├─────────────────┼───────────────────┼──────────────────────────┤
──────────┴───────────────────────────────────────────────────────┘

Приятный сюрприз: lint фактически зелёный (0 ошибок, только предупреждения). А главный блокер — один.

Корень: images.domains = [null, null]

Смотри next.config.js:
const imgHost = getHostFromUrl(process.env.NEXT_PUBLIC_IMG_URL);      // → null
const apiHost = getHostFromUrl(process.env.NEXT_PUBLIC_API_URL_BASE); // → null
...
images: { domains: [imgHost, apiHost] }   // [null, null] → Next ругается и падает
getHostFromUrl возвращает null, если URL невалидный. Мы в CI скопировали .env.example, где:
- NEXT_PUBLIC_API_URL_BASE=tobemodified — эт
- NEXT_PUBLIC_IMG_URL — вообще отсутствует в .env.example → undefined → null.

Итог: конфиг Next невалиден → build падает сгрузит тот же конфиг → тоже падает. То естьэто не код, а конфигурация окружения.

Два ценных побочных вывода (это работа DevOps — находить такое):
1. .env.example неполный — в нём нет NEXT_PUBLIC_IMG_URL, хотя сборка его требует. Новый разработчик не соберёт проект «из коробки». → в список правок боевого репо.
2. NEXT_PUBLIC_* — по комментарию в самом .env.example — инлайнятся в бандл и не являются секретами. Значит для
CI-проверки сборки достаточно синтаксически ьные значения не нужны.

Фикс: дать CI валидные dummy-URL

Задаём переменные прямо в workflow (на уровне job — видят все шаги). Убираем костыль с cp .env.example .env. Замени ci.yml на это:

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
  workflow_dispatch:

env:
  # NEXT_PUBLIC_* инлайнятся при сборке и НЕ секретны.
  # Для CI хватает валидных по синтаксису URетах при деплое.
  NEXT_PUBLIC_IMG_URL: https://img.example.com
  NEXT_PUBLIC_API_URL: https://api.example.com
  NEXT_PUBLIC_API_URL_BASE: https://api.exam
  NEXT_PUBLIC_API_URL_V2: https://api.example.com/v2

jobs:
  ci:
    name: CI (baseline v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (собирает бандл и генерит next-env.d.ts)
        continue-on-error: true
        run: npm run build
      - name: Typecheck (tsc --noEmit) — после build, чтобы появился next-env.d.ts
        continue-on-error: true
        run: npm run lint:types
      - name: Lint
        continue-on-error: true
        run: npm run lint:ts
      - name: Unit tests
        continue-on-error: true
        run: npx jest --ci --passWithNoTests