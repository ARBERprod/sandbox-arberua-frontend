name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
  workflow_dispatch:

env:
  NEXT_PUBLIC_IMG_URL: https://img.example.com
  NEXT_PUBLIC_API_URL: https://api.example.com
  NEXT_PUBLIC_API_URL_BASE: https://api.example.com
  NEXT_PUBLIC_API_URL_V2: https://api.example.com/v2

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint:ts
