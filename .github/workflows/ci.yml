Ключевой инсайт (подтвердилась теория)

Build-first убрал весь ассетный шум в tsc: next build сгенерил next-env.d.ts, и сотни TS2307 про .svg/.png испарились. Осталось ровно то, что реально сломано — и это 13 ошибок типов в тестах (useAddToCart, BuyInOneClick, TimerBlocks) + 3 падающих теста. Мелкий, конкретный, чинибельный бэклог, а не «тысяча проблем».

Решение по гейту

- Жёсткие (обязательные) гейты: Build + Lint — детерминированно зелёные.
- Мягкие (не блокируют, в бэклог на чистку):sts (3 из 740).

Проблема текущей структуры и как чинить

Сейчас всё в одном job на continue-on-error → на PR одна общая зелёная галка, которая врёт (прячет реальные падения). Чтобы гейт был честным и выборочным (обязателен build+lint, а tsc/tests — видимы, но не блокируют), правильно
разложить на отдельные jobs: каждый станет остным ✓/✗. Никакого continue-on-error —вместо этого в Уроке 4 мы просто пометим обязательными только build и lint.

