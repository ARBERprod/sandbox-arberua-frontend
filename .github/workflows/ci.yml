name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  ci:
    name: CI (baseline — пока ничего не блокирует)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install
        run: npm ci        # единственный жёсткий шаг: без зависимостей смысла нет

      - name: Build (генерит next-env.d.ts и собирает прод-бандл)
        continue-on-error: true
        run: |
          cp .env.example .env 2>/dev/null || true
          npm run build


      - name: Install
        run: npm ci        # единственный жёсткий шаг: без зависимостей смысла нет

      - name: Build (генерит next-env.d.ts и собирает прод-бандл)
        continue-on-error: true
        run: |
          cp .env.example .env 2>/dev/null || true
          npm run build

      - name: Typecheck (tsc --noEmit)
        continue-on-error: true
        run: npm run lint:types

      - name: Lint
        continue-on-error: true
        run: npm run lint:ts

      - name: Unit tests
        continue-on-error: true
        run: npx jest --ci --passWithNoTests