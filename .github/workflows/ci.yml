name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
  workflow_dispatch:

env:
  NEXT_PUBLIC_IMG_URL: https://img.example.com
  NEXT_PUBLIC_API_URL: https://api.example.com
  NEXT_PUBLIC_API_URL_BASE: https://api.example.com
  NEXT_PUBLIC_API_URL_V2: https://api.example.com/v2

jobs:
  ci:
    name: CI (baseline v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (собирает бандл и генерит next-env.d.ts)
        continue-on-error: true
        run: npm run build
      - name: Typecheck (tsc --noEmit) — после build, чтобы появился next-env.d.ts
        continue-on-error: true
        run: npm run lint:types
      - name: Lint
        continue-on-error: true
        run: npm run lint:ts
      - name: Unit tests
        continue-on-error: true
        run: npx jest --ci --passWithNoTests